project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /src/i18n/en.json
    translation: /src/i18n/%two_letters_code%.json
  # Exclude the slug, hideInMenu and sortOrder front matter keys in Crowdin's
  # Markdown/MDX parser settings, they must stay identical across locales.
  - source: /src/content/help/en/**/*.md*
    translation: /src/content/help/%two_letters_code%/**/%original_file_name%
  - source: /src/content/pages/en/**/*.md*
    translation: /src/content/pages/%two_letters_code%/**/%original_file_name%
